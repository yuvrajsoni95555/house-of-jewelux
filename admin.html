<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Only this site and GitHub's API: keeps the admin token away from any injected script -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com; font-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Admin — House of Jewelux</title>
  <link rel="icon" type="image/png" href="/brand-identity/favicon-32x32.png">
  <style>
    @font-face { font-family: 'Lawrence'; src: url('/fonts/Lawrence-Regular.otf'); font-display: swap; }
    /* ===== House of Jewelux admin design tokens (brand palette only; tints are mixes of it) ===== */
    :root {
      --c-espresso: #1A120B; --c-brown: #3A2418; --c-brown-2: #6B4A2E; --c-gold: #A88462; --c-beige: #D5C4AE; --c-neutral: #4A4A46;
      --canvas: color-mix(in srgb, var(--c-beige) 22%, #fff);
      --surface: #fff;
      --surface-2: color-mix(in srgb, var(--c-beige) 12%, #fff);
      --line: color-mix(in srgb, var(--c-beige) 75%, #fff);
      --line-strong: var(--c-beige);
      --text: var(--c-neutral);
      --heading: var(--c-espresso);
      --muted: color-mix(in srgb, var(--c-neutral) 82%, #fff);
      --accent-soft: color-mix(in srgb, var(--c-gold) 16%, #fff);
      /* semantic status, kept muted so it sits inside the palette */
      --ok: #3F6B4A; --ok-bg: #EEF3EE; --warn: #8A6420; --warn-bg: #F7F0E2; --bad: #8E2F25; --bad-bg: #F8ECEA;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
      --r-sm: 6px; --r: 10px; --r-lg: 14px;
      --control: 44px;
      --shadow: 0 1px 2px rgba(26, 18, 11, .05), 0 4px 16px rgba(26, 18, 11, .05);
      --shadow-lg: 0 24px 60px rgba(26, 18, 11, .35);
      --ease: cubic-bezier(.2, .7, .2, 1);
      --side-w: 248px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font: 14px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text); background: var(--canvas); }
    h1, h2, h3 { font-family: 'Lawrence', Georgia, serif; font-weight: 400; color: var(--heading); margin: 0 0 var(--s4); line-height: 1.25; }
    h1 { font-size: 1.65rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; margin-bottom: var(--s3); }
    a { color: var(--c-brown-2); }
    button, input, select, textarea { font: inherit; color: inherit; }
    input, select, textarea { width: 100%; min-height: var(--control); padding: 0 var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
      transition: border-color .15s, box-shadow .15s; }
    textarea { padding: var(--s3); min-height: 110px; resize: vertical; line-height: 1.5; }
    input[readonly] { background: var(--surface-2); color: var(--muted); }
    input:hover, select:hover, textarea:hover { border-color: var(--c-gold); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--c-gold); box-shadow: 0 0 0 3px var(--accent-soft); }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--c-gold); outline-offset: 2px; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--c-brown); margin-bottom: var(--s1); letter-spacing: .02em; }
    .req::after { content: ' *'; color: var(--bad); }
    .help { font-size: .78rem; color: var(--muted); margin: var(--s1) 0 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--control); padding: 0 var(--s4); border-radius: var(--r-sm);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--c-brown); cursor: pointer; white-space: nowrap; text-decoration: none;
      font-weight: 500; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
    .btn:hover { border-color: var(--c-gold); background: var(--surface-2); }
    .btn-primary { background: var(--c-brown); border-color: var(--c-brown); color: #fff; }
    .btn-primary:hover { background: var(--c-espresso); border-color: var(--c-espresso); box-shadow: 0 6px 18px rgba(58, 36, 24, .25); }
    .btn-accent { background: var(--c-gold); border-color: var(--c-gold); color: var(--c-espresso); }
    .btn-accent:hover { background: var(--c-brown-2); border-color: var(--c-brown-2); color: #fff; }
    .btn-danger { color: var(--bad); }
    .btn-danger:hover { border-color: var(--bad); background: var(--bad-bg); }
    .btn-sm { min-height: 34px; padding: 0 var(--s3); font-size: .85rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: .8rem; }

    /* ===== login ===== */
    body.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--s5) var(--s4);
      background: radial-gradient(120% 80% at 50% 0%, var(--c-brown-2) 0%, var(--c-brown) 45%, var(--c-espresso) 100%); }
    .login { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c-gold);
      border-radius: var(--r-lg); padding: var(--s6) var(--s6) var(--s5); box-shadow: var(--shadow-lg); animation: rise .5s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .login img { display: block; height: 64px; margin: 0 auto var(--s3); }
    .login-brand { text-align: center; font-family: 'Lawrence', Georgia, serif; font-size: 1.2rem; letter-spacing: .16em; text-transform: uppercase; color: var(--c-brown); margin: 0; }
    .login-rule { width: 56px; height: 1px; background: var(--c-gold); margin: var(--s3) auto var(--s4); border: 0; }
    .login h1 { text-align: center; font-size: 1.25rem; margin-bottom: var(--s5); }
    .login .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: calc(var(--s3) * -1) 0 var(--s5); }
    .login label { margin-top: var(--s4); } .login label:first-of-type { margin-top: 0; }
    .pw { position: relative; }
    .pw input { padding-right: 48px; }
    .pw button { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: var(--r-sm);
      background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
    .pw button:hover { color: var(--c-brown); }
    .btn-login { width: 100%; margin-top: var(--s5); min-height: 48px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
    .login .errors { margin: var(--s4) 0 0; }
    .forgot { display: block; width: fit-content; margin: var(--s4) auto 0; font-size: .85rem; color: var(--c-brown-2); text-decoration: none; border-bottom: 1px solid var(--c-beige); }
    .forgot:hover { color: var(--c-gold); border-color: var(--c-gold); }

    /* ===== shell ===== */
    .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
    .side { background: var(--c-espresso); color: var(--c-beige); padding: var(--s5) var(--s3); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
    .side .brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2) var(--s5); margin-bottom: var(--s3); border-bottom: 1px solid rgba(213, 196, 174, .14);
      font-family: 'Lawrence', Georgia, serif; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
    .side .brand img { height: 34px; }
    .side nav button { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 42px; text-align: left; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm);
      background: none; color: var(--c-beige); cursor: pointer; margin-bottom: 2px; transition: background .15s, color .15s; position: relative; }
    .side nav button svg { flex: none; opacity: .85; }
    .side nav button:hover { background: rgba(213, 196, 174, .08); color: #fff; }
    .side nav button[aria-current="page"] { background: rgba(168, 132, 98, .18); color: #fff; }
    .side nav button[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--c-gold); }
    .side .foot { margin-top: auto; padding: var(--s4) var(--s2) 0; border-top: 1px solid rgba(213, 196, 174, .14); font-size: .8rem; display: grid; gap: var(--s2); }
    .side .foot a { color: var(--c-beige); }
    .side .foot button { color: var(--c-beige); background: none; border: 1px solid rgba(213, 196, 174, .3); border-radius: var(--r-sm); min-height: 36px; cursor: pointer; }
    .side .foot button:hover { border-color: var(--c-gold); color: #fff; }
    .topbar { display: none; }
    main { padding: var(--s6) var(--s6) var(--s7); max-width: 1240px; width: 100%; margin: 0 auto; }
    main.wide { max-width: none; padding: 0; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s5); }
    .page-head h1 { margin: 0; } .page-head p { margin: var(--s1) 0 0; color: var(--muted); }

    /* ===== cards, panels, dashboard ===== */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s4); margin-bottom: var(--s5); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4) var(--s5); box-shadow: var(--shadow); text-align: left; font: inherit; color: inherit; }
    button.card { cursor: pointer; transition: border-color .15s, transform .15s var(--ease); }
    button.card:hover { border-color: var(--c-gold); transform: translateY(-1px); }
    .card .num { font-size: 1.9rem; font-family: 'Lawrence', Georgia, serif; color: var(--c-brown); line-height: 1.2; }
    .card .lbl { color: var(--muted); font-size: .85rem; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); margin-bottom: var(--s4); box-shadow: var(--shadow); }
    .panel > h3:first-child { padding-bottom: var(--s3); border-bottom: 1px solid var(--line); margin-bottom: var(--s4); }
    .dash { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
    .bars { display: grid; gap: var(--s3); }
    .bar { display: grid; grid-template-columns: 110px 1fr 36px; gap: var(--s3); align-items: center; font-size: .85rem; text-transform: capitalize; }
    .bar .track { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--c-brown-2), var(--c-gold)); border-radius: 99px; }
    .bar b { text-align: right; color: var(--c-brown); }
    .health { display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s4); }
    .ring { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: conic-gradient(var(--c-gold) calc(var(--v) * 1%), var(--surface-2) 0); }
    .ring span { width: 66px; height: 66px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: 'Lawrence', Georgia, serif; font-size: 1.25rem; color: var(--c-brown); }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }

    /* ===== tables ===== */
    .toolbar { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; margin-bottom: var(--s4); }
    .toolbar input, .toolbar select { width: auto; flex: 1 1 200px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    th { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); }
    td b { color: var(--heading); font-weight: 600; }
    tr.row { cursor: pointer; transition: background .12s; } tr.row:hover td { background: var(--surface-2); }
    .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: var(--r-sm); background: var(--line); display: block; }
    .pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 99px; font-size: .74rem; font-weight: 500; white-space: nowrap; margin: 1px 2px 1px 0; }
    .pill.published, .pill.low { color: var(--ok); background: var(--ok-bg); }
    .pill.draft, .pill.medium, .pill.dirty { color: var(--warn); background: var(--warn-bg); }
    .pill.out, .pill.high { color: var(--bad); background: var(--bad-bg); }

    /* ===== forms ===== */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s5); }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4) var(--s5); }
    .full { grid-column: 1 / -1; }
    .count { float: right; font-weight: 400; color: var(--muted); }
    .count.over { color: var(--bad); }
    .check { display: inline-flex; align-items: center; gap: var(--s2); font-weight: 400; color: var(--text); font-size: .9rem; min-height: var(--control); margin: 0; }
    .check input { width: 18px; min-height: 18px; height: 18px; accent-color: var(--c-brown); }
    .slot { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: var(--s4); align-items: start; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: var(--s3); background: var(--surface); }
    .slot img { width: 88px; height: 88px; object-fit: cover; border-radius: var(--r-sm); background: var(--line); }
    .slot .acts { display: flex; flex-direction: column; gap: var(--s1); }
    .slot.missing { border-color: color-mix(in srgb, var(--bad) 35%, #fff); background: var(--bad-bg); }
    .drop { display: block; width: 100%; border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: var(--s5); text-align: center; color: var(--muted); background: none; cursor: pointer; transition: border-color .15s, background .15s; }
    .drop:hover, .drop.over { border-color: var(--c-gold); background: var(--accent-soft); color: var(--c-brown); }
    .snippet { border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); background: var(--surface); font-family: Arial, sans-serif; }
    .snippet .u { color: #202124; font-size: .8rem; word-break: break-all; } .snippet .t { color: #1a0dab; font-size: 1.1rem; margin: var(--s1) 0; }
    .snippet .d { color: #4d5156; font-size: .85rem; }
    pre.code { background: var(--c-espresso); color: var(--c-beige); padding: var(--s4); border-radius: var(--r); overflow: auto; font-size: .78rem; max-height: 320px; margin: 0; white-space: pre-wrap; word-break: break-word; }
    .savebar { position: sticky; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
      padding: var(--s3) 0; display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--s4); }
    .errors { color: var(--bad); background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 30%, #fff); border-radius: var(--r-sm); padding: var(--s3) var(--s4); margin-bottom: var(--s4); }
    .toast { position: fixed; right: var(--s4); bottom: var(--s4); max-width: 400px; background: var(--c-espresso); color: #fff; padding: var(--s3) var(--s4); border-radius: var(--r);
      border-left: 3px solid var(--c-gold); box-shadow: var(--shadow-lg); z-index: 60; animation: rise .25s var(--ease) both; }
    .toast.bad { border-left-color: #E3A59B; }
    .note { border-left: 3px solid var(--c-gold); padding: var(--s3) var(--s4); background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--muted); }
    ul.log { list-style: none; padding: 0; margin: 0; } ul.log li { padding: var(--s3) 0; border-bottom: 1px solid var(--line); } ul.log li:last-child { border-bottom: 0; }
    .skel { border-radius: var(--r); background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .tabs { display: flex; gap: var(--s1); border-bottom: 1px solid var(--line); margin-bottom: var(--s4); overflow-x: auto; scrollbar-width: none; }
    .tabs button { border: 0; background: none; padding: 0 var(--s4); min-height: var(--control); cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
    .tabs button[aria-selected="true"] { color: var(--c-brown); border-bottom-color: var(--c-gold); }
    .tabs button:hover { color: var(--c-brown); }
    [role="tabpanel"] { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ===== product workspace: editor | live preview ===== */
    .ws { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
    .ws-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: var(--s3) var(--s5); display: flex; flex-wrap: wrap; gap: var(--s3) var(--s4); align-items: center; z-index: 10; }
    .ws-title { display: flex; align-items: center; gap: var(--s3); min-width: 0; flex: 1 1 320px; }
    .ws-title h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-url { display: flex; align-items: center; gap: var(--s2); flex: 1 1 100%; order: 3; font-size: .8rem; color: var(--muted); min-width: 0; flex-wrap: wrap; }
    .ws-url code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px var(--s2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 200px; }
    .ws-actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
    .ws-body { display: grid; grid-template-columns: minmax(440px, 1fr) minmax(400px, 1.1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
    .ws-editor { overflow: auto; padding: var(--s5); border-right: 1px solid var(--line); }
    .ws-preview { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--surface-2); }
    .pv-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--surface); }
    .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
    .seg button { border: 0; background: none; padding: 0 var(--s3); min-height: 34px; cursor: pointer; color: var(--muted); font-size: .85rem; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--c-brown); color: #fff; }
    .pv-stage { position: relative; overflow: hidden; padding: var(--s4); }
    .pv-frame { display: block; border: 1px solid var(--line-strong); border-radius: var(--r); background: #fff; box-shadow: var(--shadow); transform-origin: top left; position: absolute; top: var(--s4); }
    .pv-loading { position: absolute; inset: var(--s4); z-index: 1; }
    .ws-switch { display: none; }

    /* ===== responsive ===== */
    @media (max-width: 1180px) {
      .ws-body { grid-template-columns: 1fr; }
      .ws-switch { display: inline-flex; }
      .ws-body[data-pane="editor"] .ws-preview, .ws-body[data-pane="preview"] .ws-editor { display: none; }
      .ws-editor { border-right: 0; }
    }
    @media (max-width: 1024px) { .dash { grid-template-columns: 1fr; } main { padding: var(--s5) var(--s5) var(--s7); } }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 40; transform: translateX(-100%); transition: transform .25s var(--ease); }
      .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(26, 18, 11, .45); }
      .topbar { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); background: var(--c-espresso); color: #fff; position: sticky; top: 0; z-index: 30; min-height: 56px; }
      .topbar button { background: none; border: 1px solid rgba(213, 196, 174, .35); color: #fff; border-radius: var(--r-sm); padding: 0 var(--s3); min-height: 40px; cursor: pointer; }
      .topbar span { font-family: 'Lawrence', Georgia, serif; letter-spacing: .08em; text-transform: uppercase; }
      main { padding: var(--s4) var(--s4) var(--s7); }
      .ws { height: calc(100vh - 56px); }
      .ws-head { padding: var(--s3) var(--s4); }
      .ws-editor { padding: var(--s4); }
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .hide-sm { display: none; }
      .slot { grid-template-columns: 64px minmax(0, 1fr); } .slot img { width: 64px; height: 64px; }
      .slot .acts { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
      .login { padding: var(--s5) var(--s4) var(--s4); }
    }
    @media (max-width: 420px) {
      th, td { padding: var(--s2) var(--s3); }
      .ws-actions { width: 100%; } .ws-actions .btn { flex: 1 1 auto; }
      .quick { grid-template-columns: 1fr; }
      .bar { grid-template-columns: 84px 1fr 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login hidden" aria-labelledby="login-title">
    <img src="/brand-identity/jewelux-only-logo-emblem.png" alt="">
    <p class="login-brand">House of Jewelux</p>
    <hr class="login-rule">
    <h1 id="login-title">Admin Sign In</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter your username" required>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button type="button" data-toggle-pw="password" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <p id="login-error" class="errors hidden" role="alert"></p>
      <button class="btn btn-primary btn-login" type="submit">Login</button>
    </form>
    <a class="forgot" href="#setup">Forgot Password?</a>
  </section>

  <!-- PASSWORD RESET / FIRST SETUP (admin.html#setup): only someone who controls the GitHub account can create the token it needs -->
  <section id="setup" class="login hidden" aria-labelledby="setup-title">
    <img src="/brand-identity/jewelux-only-logo-emblem.png" alt="">
    <p class="login-brand">House of Jewelux</p>
    <hr class="login-rule">
    <h1 id="setup-title">Reset admin login</h1>
    <p class="sub">Only the website owner can do this. It needs a GitHub access token.</p>
    <form id="setup-form">
      <label for="setup-token">GitHub access token</label>
      <div class="pw">
        <input id="setup-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required>
        <button type="button" data-toggle-pw="setup-token" aria-label="Show token" aria-pressed="false"></button>
      </div>
      <label for="setup-user">New username</label>
      <input id="setup-user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Choose a username" minlength="3" required>
      <label for="setup-pass">New password</label>
      <div class="pw">
        <input id="setup-pass" type="password" autocomplete="new-password" placeholder="At least 12 characters" minlength="12" required>
        <button type="button" data-toggle-pw="setup-pass" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <label for="setup-pass2">Repeat password</label>
      <input id="setup-pass2" type="password" autocomplete="new-password" placeholder="Enter it again" minlength="12" required>
      <p id="setup-error" class="errors hidden" role="alert"></p>
      <button class="btn btn-primary btn-login" type="submit">Save login</button>
    </form>
    <a class="forgot" href="#">Back to login</a>
  </section>

  <!-- APP -->
  <div id="app" class="shell hidden">
    <aside class="side" id="side">
      <div class="brand"><img src="/brand-identity/jewelux-only-logo-emblem.png" alt="">House of Jewelux</div>
      <nav aria-label="Admin sections">
        <button data-view="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
        <button data-view="products"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l3 6 3-6M12 9v12"/></svg>Products</button>
        <button data-view="seo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Homepage SEO</button>
        <button data-view="audit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>SEO audit</button>
        <button data-view="robots"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>robots.txt</button>
      </nav>
      <div class="foot">
        <div id="who" class="small"></div>
        <a href="/" target="_blank" rel="noopener">View website ↗</a>
        <button id="logout" type="button">Sign out</button>
      </div>
    </aside>
    <div>
      <div class="topbar"><button id="menu" type="button" aria-controls="side" aria-expanded="false">☰ Menu</button><span id="top-title">Admin</span></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/admin-lib.js?v=4"></script>
  <script src="/admin.js?v=7"></script>
</body>
</html>

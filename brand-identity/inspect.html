<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monogram Geometry Inspection</title>
<style>
  body { background: #FAF8F5; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; width: 100%; max-width: 1200px; }
  .card { background: #FFFFFF; border: 1px solid #E8DFD1; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
  .card.noir { background: #141110; color: #FAF8F5; }
  h3 { margin-top: 0; color: #9A7B48; font-weight: 500; font-size: 16px; letter-spacing: 2px; }
  svg { width: 100%; height: 280px; }
</style>
</head>
<body>
  <h1>HOUSE OF JEWELUX ? Monogram Iterations</h1>
  <div class="grid">
    <div class="card">
      <h3>VARIATION A (Current Interlock)</h3>
      <img src="svg/jewelux-logo-monogram-emblem.svg" style="width:260px; height:260px;">
    </div>
    <div class="card noir">
      <h3>VARIATION A (Noir Contrast)</h3>
      <img src="svg/jewelux-logo-monogram-transparent.svg" style="width:260px; height:260px; filter: drop-shadow(0 0 10px rgba(212,190,155,0.4));">
    </div>
    <div class="card">
      <h3>FULL VERTICAL SIGNATURE</h3>
      <img src="svg/jewelux-logo-primary-ivory.svg" style="width:260px; height:325px;">
    </div>
  </div>
</body>
</html>

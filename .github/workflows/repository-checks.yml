name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find . -path './.git' -prune -o -path './vendor' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test
